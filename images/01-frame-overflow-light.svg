<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 744 224" role="img" aria-label="When the main loop finishes before the next NMI, each frame is new. When it runs past the NMI, that NMI finds the game unfinished, skips the screen update, and the frame is lost." width="744" height="224">
