<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 636" role="img" aria-label="Memory map. New code sits in page 1 of RAM, in unused and title-only work RAM, in place in the sound code of banks 0 to 5, in each bank's padding and in 18 freed pieces of the fixed bank. Bank 6 stores the RAM code and tables, which a loader copies into work RAM and page 1 whenever graphics load." width="804" height="636">
