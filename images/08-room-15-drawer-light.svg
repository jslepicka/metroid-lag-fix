<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 512" role="img" aria-label="Room 15 of Ridley's hideout: a ceiling of bricks in the top two metatile rows, lava in the bottom two rows, and pillars standing on the floor. A 32 by 32 pixel attribute block and a single metatile are outlined." width="784" height="512">
          <rect x="-12.0" y="-12.0" width="784.0" height="512.0" rx="8" fill="#fbfcfd" stroke="#cfd6de" /><g transform="translate(0,0)"><image x="0" y="4" width="512" height="480" href="data:image/png;base64," style="image-rendering:pixelated;image-rendering:crisp-edges" />
          <rect x="160" y="260" width="32" height="32" fill="none" stroke="#ffffff" stroke-width="2" />
          <rect x="128" y="260" width="64" height="64" stroke-dasharray="4 3" fill="none" stroke="#ffffff" stroke-width="2" />
          <line x1="196" y1="276" x2="540" y2="160" stroke="#44515f" stroke-width="1.5" fill="none" />
          <line x1="196" y1="320" x2="540" y2="330" stroke="#44515f" stroke-width="1.5" fill="none" />
          <text x="548" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#142231" font-weight="600">metatile: 2×2 tiles</text>
          <text x="548" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">16 × 16 pixels, 4 tile numbers</text>
          <text x="548" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">from the area's metatile table</text>
          <text x="548" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#142231" font-weight="600">attribute byte: 2×2 metatiles</text>
          <text x="548" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">one byte holds the palettes of</text>
          <text x="548" y="354" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">four metatiles, 2 bits each</text>
          <text x="548" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#142231" font-weight="600">structures</text>
          <text x="548" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">ceiling, lava, pillars: each a few</text>
          <text x="548" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">rows of metatiles from the ROM</text>
        </g></svg>