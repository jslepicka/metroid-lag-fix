<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 724 274" role="img" aria-label="A vertical room stacks two name tables. An enemy at y 230 on the upper table and a shot at y 6 on the lower table are 16 lines apart, but their 8-bit y values differ by 224." width="724" height="274">
          <rect x="-12.0" y="-12.0" width="724.0" height="274.0" rx="8" fill="#fbfcfd" stroke="#cfd6de" /><g transform="translate(0,0)"><rect x="60" y="20" width="200" height="105" fill="#e9eef3" />
          <rect x="60" y="127" width="200" height="105" fill="#e9eef3" />
          <text x="160" y="40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#687584">name table 0 (y 0-239)</text>
          <text x="160" y="226" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#687584">name table 1 (y 0-239)</text>
          <line x1="50" y1="126" x2="270" y2="126" stroke-dasharray="4 3" stroke="#b2441e" stroke-width="1.5" fill="none" />
          <text x="278" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#b2441e">seam</text>
          <rect x="130" y="102" width="30" height="18" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5" />
          <text x="125" y="115" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#142231">enemy, y = 230</text>
          <rect x="140" y="133" width="10" height="10" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5" />
          <text x="156" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#142231">shot, y = 6</text>
          <text x="340" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#142231" font-weight="600">8-bit subtraction</text>
          <text x="340" y="80" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11px" fill="#44515f">230 − 6 = 224: looks far apart</text>
          <text x="340" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#142231" font-weight="600">What the full test computes</text>
          <text x="340" y="140" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11px" fill="#44515f">(240 − 230) + 6 = 16: almost touching</text>
          <text x="340" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">The quick test does the same 16-line correction</text>
          <text x="340" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#44515f">in 8 bits, so it can still reject the far pairs exactly.</text>
        </g></svg>